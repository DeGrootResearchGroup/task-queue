x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - task_queue_data:/app/data
    expose:
      - "8000"
    networks:
      - internal
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - app
    logging: *default-logging
    # Without this, containers inherit the host's /etc/resolv.conf, which on
    # systemd-resolved hosts (e.g. Ubuntu) points at 127.0.0.53 — the host's
    # local stub resolver, unreachable from inside a container. That breaks
    # Caddy's ACME lookups to Let's Encrypt with a "connection refused" DNS
    # error. Pinning public resolvers sidesteps the host's resolv.conf
    # entirely.
    dns:
      - 1.1.1.1
      - 8.8.8.8

networks:
  internal:

volumes:
  task_queue_data:
  caddy_data:
  caddy_config:
